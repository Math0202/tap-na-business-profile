<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Business Cards - Tangeni Matheus</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
  <style>
    html {
      background-color: #121212;
    }
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #121212;
    }
    .app-background { background-color: #121212; }
    .card-item-bg { background-color: #2a2a2a; }
    .profile-banner {
      background-image: url('background.png');
      background-size: cover;
      background-position: center top;
      height: 220px;
    }
    .banner-overlay {
      background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(18,18,18,1) 95%);
    }
    .page-sheet {
      background-color: #121212;
      min-height: calc(100vh - 220px + 4rem);
    }
    .liquid-glass-nav {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      width: min(calc(100% - 2rem), 22rem);
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 1.15rem;
      border-radius: 9999px;
      color: #111;
      isolation: isolate;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.18) 42%, rgba(255,255,255,0.28) 100%);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.45);
      box-shadow:
        0 10px 30px rgba(0,0,0,0.35),
        0 2px 8px rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.75),
        inset 0 -1px 0 rgba(255,255,255,0.15);
    }
    .liquid-glass-nav::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.55) 0%,
        rgba(255,255,255,0.08) 38%,
        rgba(255,255,255,0) 55%,
        rgba(255,255,255,0.12) 100%
      );
      z-index: -1;
    }
    .liquid-glass-nav::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 12%;
      right: 12%;
      height: 42%;
      border-radius: 9999px;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0));
      filter: blur(1px);
      z-index: -1;
      opacity: 0.7;
    }
    .liquid-glass-nav a,
    .liquid-glass-nav button {
      position: relative;
      z-index: 1;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .liquid-glass-nav a:active,
    .liquid-glass-nav button:active {
      transform: scale(0.92);
    }
    .nav-active { color: #0a0a0a; }
    .nav-inactive { color: rgba(0,0,0,0.4); }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center overflow-x-hidden">
  <!-- Fixed banner behind everything -->
  <div class="fixed top-0 left-0 right-0 max-w-md mx-auto z-0" aria-hidden="true">
    <div class="profile-banner w-full relative">
      <div class="banner-overlay absolute inset-0"></div>
    </div>
    <div class="h-screen app-background"></div>
  </div>

  <!-- Page content scrolls over the banner -->
  <main class="w-full max-w-md min-h-screen flex flex-col relative z-10 pb-28">
    <div class="h-[160px] shrink-0" aria-hidden="true"></div>
    <div class="page-sheet rounded-t-3xl px-6 pt-6 space-y-5 flex-1">
      <header class="pb-1">
        <h1 class="text-2xl font-bold tracking-tight">Business Cards</h1>
        <p class="text-gray-400 text-sm mt-1">Get your NFC-ready card powered by tap-na</p>
      </header>

      <!-- Blue Edition -->
      <article class="card-item-bg rounded-3xl overflow-hidden" data-card="blue">
        <div class="bg-zinc-900 px-4 pt-5 pb-3 flex justify-center">
          <img
            src="blue-card.png"
            alt="Blue Connect NFC business card front and back"
            class="w-full max-w-[280px] h-auto object-contain drop-shadow-xl"
          >
        </div>
        <div class="p-5">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h2 class="text-lg font-semibold whitespace-nowrap overflow-hidden text-ellipsis">Blue Edition</h2>
              <p class="text-gray-400 text-sm mt-0.5">Gradient blue · NFC + QR</p>
            </div>
            <span class="shrink-0 text-xs font-medium px-2.5 py-1 rounded-full bg-blue-500/20 text-blue-300">Popular</span>
          </div>
          <button
            type="button"
            class="order-btn mt-4 w-full py-3.5 rounded-full bg-white text-black font-bold text-sm hover:bg-gray-200 transition-colors flex items-center justify-center gap-2"
            data-card-name="Blue Edition"
          >
            <span class="material-symbols-outlined text-[18px]">shopping_bag</span>
            Order Mine
          </button>
        </div>
      </article>

      <!-- Black Edition -->
      <article class="card-item-bg rounded-3xl overflow-hidden" data-card="black">
        <div class="bg-zinc-900 px-4 pt-5 pb-3 flex justify-center">
          <img
            src="black-card.png"
            alt="Black Connect NFC business card front and back"
            class="w-full max-w-[280px] h-auto object-contain drop-shadow-xl"
          >
        </div>
        <div class="p-5">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h2 class="text-lg font-semibold whitespace-nowrap overflow-hidden text-ellipsis">Black Edition</h2>
              <p class="text-gray-400 text-sm mt-0.5">Matte charcoal · NFC + QR</p>
            </div>
            <span class="shrink-0 text-xs font-medium px-2.5 py-1 rounded-full bg-zinc-600/40 text-gray-300">Classic</span>
          </div>
          <button
            type="button"
            class="order-btn mt-4 w-full py-3.5 rounded-full bg-white text-black font-bold text-sm hover:bg-gray-200 transition-colors flex items-center justify-center gap-2"
            data-card-name="Black Edition"
          >
            <span class="material-symbols-outlined text-[18px]">shopping_bag</span>
            Order Mine
          </button>
        </div>
      </article>
    </div>
  </main>

  <!-- Order confirmation toast -->
  <div id="order-toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-[60] hidden px-4 py-3 rounded-2xl bg-white text-black text-sm font-medium shadow-xl max-w-xs text-center">
    Order request started for <span id="order-toast-name"></span>
  </div>

  <!-- Bottom Navigation -->
  <nav class="liquid-glass-nav">
    <a href="index.html" class="flex flex-col items-center gap-0.5 nav-inactive" aria-label="Home">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
      <span class="text-[10px] font-medium">Home</span>
    </a>
    <a href="index.html#share" class="flex flex-col items-center gap-0.5 nav-inactive" aria-label="Share QR">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
      <span class="text-[10px] font-medium">QR</span>
    </a>
    <a href="cards.html" class="flex flex-col items-center gap-0.5 nav-active" aria-current="page" aria-label="Business Cards">
      <span class="material-symbols-outlined text-[26px]">credit_card</span>
      <span class="text-[10px] font-semibold">Cards</span>
    </a>
    <a href="profile.html" class="w-8 h-8 rounded-full overflow-hidden border border-white/50 shadow-sm" aria-label="Profile">
      <img alt="Profile" class="w-full h-full object-cover" src="personal.jpeg">
    </a>
  </nav>

  <script src="profile-store.js"></script>
  <script>
    const toast = document.getElementById('order-toast');
    const toastName = document.getElementById('order-toast-name');
    let toastTimer;
    const profile = ProfileStore.load();
    const navAvatar = document.querySelector('.liquid-glass-nav img');
    if (navAvatar) navAvatar.src = ProfileStore.avatarUrl(profile);

    document.querySelectorAll('.order-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const name = btn.getAttribute('data-card-name') || 'this card';
        toastName.textContent = name;
        toast.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.add('hidden'), 2500);

        const p = ProfileStore.load();
        const subject = encodeURIComponent('Order NFC Business Card – ' + name);
        const body = encodeURIComponent(
          'Hi,\n\nI would like to order the ' + name + ' NFC business card.\n\nName: ' +
          (p.name || '') + '\nCompany: ' + (p.company || '') + '\n\nThanks!'
        );
        window.location.href = 'mailto:orders@tap-na.com?subject=' + subject + '&body=' + body;
      });
    });
  </script>
</body>
</html>
